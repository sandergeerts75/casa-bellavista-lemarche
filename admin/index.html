<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Beheer – Casa Bellavista</title>

    <!-- Netlify Identity (login & reset) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Decap CMS (bundel) -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Handmatige initialisatie inschakelen -->
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <!-- Belangrijk: mountpunt voor de CMS-app -->
    <div id="nc-root"></div>

    <script>
      // Na login pagina opnieuw laden
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => location.reload());
          }
        });
      }

      // Wacht tot DOM en decap-cms klaar zijn, dán initialiseren
      function startCMS() {
        if (window.initCMS && document.getElementById("nc-root")) {
          window.initCMS({
            config: {
              backend: { name: "git-gateway", branch: "main" },
              media_folder: "images",
              public_folder: "/images",
              collections: [
                {
                  name: "settings",
                  label: "Site instellingen",
                  files: [
                    {
                      file: "data/site.json",
                      label: "Site",
                      name: "site",
                      format: "json",
                      fields: [
                        { label: "Merknaam", name: "brand", widget: "string", required: false },
                        { label: "E-mail (website)", name: "contactEmail", widget: "string", required: false },
                        { label: "Primaire domein", name: "primaryDomain", widget: "string", required: false }
                      ]
                    }
                  ]
                }
              ]
            }
          });
        } else {
          setTimeout(startCMS, 50);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startCMS);
      } else {
        startCMS();
      }
    </script>
  </body>
</html>
