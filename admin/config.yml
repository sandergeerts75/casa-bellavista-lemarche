backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site instellingen"
    files:
      - file: "data/site.json"
        label: "Site"
        name: "site"
        format: "json"
        fields:
          - { label: "Merknaam", name: "brand", widget: "string", required: false }
          - { label: "E-mail (website)", name: "contactEmail", widget: "string", required: false }
          - { label: "Primaire domein", name: "primaryDomain", widget: "string", required: false }
